[pytest]
norecursedirs = tmp.* build benchmark _site OLD
addopts = -p no:warnings --basetemp=.pytest-tmp -m "not network"
markers =
    network: checks live external services and is excluded from isolated local test runs
testpaths =
    tests/basic
    tests/help
    tests/browser
    tests/scrape

env =
    KLYRO_ANALYTICS=false

