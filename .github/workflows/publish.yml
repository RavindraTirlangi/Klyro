name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/basic tests/help

  publish:
    name: Build & Publish
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for setuptools_scm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Smoke-test wheel install and uninstall
        run: |
          python -m venv /tmp/klyro-wheel-test
          /tmp/klyro-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/klyro-wheel-test/bin/klyro --version
          /tmp/klyro-wheel-test/bin/python -m klyro --version
          /tmp/klyro-wheel-test/bin/python -m pip uninstall -y klyro
          /tmp/klyro-wheel-test/bin/python -c "import importlib.util; assert importlib.util.find_spec('klyro') is None"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
