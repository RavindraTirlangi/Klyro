name: Docker Build Test

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "pyproject.toml"
      - "requirements.txt"
  pull_request:
    paths:
      - "docker/**"
      - "pyproject.toml"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
