name: External URL Check

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

jobs:
  urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check documented external URLs
        run: python -m pytest tests/basic/test_urls.py -m network
